name: kurukoo

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      KURUKOO_WORKERS: 1
      KURUKOO_PERSISTENT_STATE_REQUIRED: "true"
      DB_PATH: /app/data/kurukoo.sqlite
      KURUKOO_METRICS_ENABLED: "true"
      KURUKOO_DATABASE_MODE: ${KURUKOO_DATABASE_MODE:-sqljs}
      KURUKOO_JOB_MODE: ${KURUKOO_JOB_MODE:-in_process}
      KURUKOO_REDIS_URL: ${KURUKOO_REDIS_URL:-redis://redis:6379}
      KURUKOO_OTEL_ENDPOINT: ${KURUKOO_OTEL_ENDPOINT:-http://otel-collector:4318}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - kurukoo-data:/app/data
      - kurukoo-uploads:/app/tmp/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kurukoo}
      POSTGRES_USER: ${POSTGRES_USER:-kurukoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  kurukoo-data:
  kurukoo-uploads:
  postgres-data:
  redis-data:
  prometheus-data:
