apiVersion: apps/v1
kind: Deployment
metadata:
  name: kurukoo
  namespace: kurukoo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kurukoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kurukoo
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kurukoo
          image: ghcr.io/temeaco-max/kurukoo:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kurukoo-runtime
            - secretRef:
                name: kurukoo-secrets
                optional: true
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: uploads
              mountPath: /app/tmp/uploads
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: kurukoo-data
        - name: uploads
          persistentVolumeClaim:
            claimName: kurukoo-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kurukoo-data
  namespace: kurukoo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kurukoo-uploads
  namespace: kurukoo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
