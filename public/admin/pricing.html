<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kurukoo Admin - Pricing Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/site.css">
    <style>
        :root {
            --cream: #FFF8F0;
            --terracotta: #D97A5C;
            --electric-blue: #1E88E5;
            --charcoal: #2E2E2E;
        }
        body { background-color: var(--cream); font-family: 'Inter', sans-serif; color: var(--charcoal); margin:0; padding:0; }
        .header-bar { background: var(--charcoal); color: var(--cream); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: var(--terracotta); }
        nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-weight: 500; font-size: 14px; padding: 6px 12px; border-radius: 4px; transition: background 0.2s; }
        nav a:hover, nav a.active { background: rgba(255,248,240,0.15); }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card-box { background: #FFFFFF; border: 1px solid #E0D0C0; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 12px rgba(46,46,46,0.03); }
        .btn { background: var(--terracotta); color: #FFF; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: #777; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { padding: 12px 16px; border-bottom: 1px solid #E0D0C0; text-align: left; }
        th { background: rgba(217,122,92,0.1); font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: var(--charcoal); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; color: #FFF; }
        .badge-active { background: #28a745; }
        .badge-inactive { background: #dc3545; }
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: #FFF; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: 'Inter', sans-serif; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="logo"><span>Kurukoo</span> Pricing Admin</div>
        <nav>
            <a href="/admin/dashboard.html">Console</a>
            <a href="/admin/users.html">Users</a>
            <a href="/admin/pricing.html" class="active">Pricing</a>
            <a href="/admin/commissions.html">Commissions</a>
            <a href="/dashboard.html" target="_blank">View Live App</a>
        </nav>
    </div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-family: 'Space Grotesk', sans-serif; margin:0;">Subscription Pricing Plans</h2>
            <button class="btn" onclick="openCreateModal()">+ Add New Plan</button>
        </div>

        <div class="card-box">
            <table>
                <thead>
                    <tr>
                        <th>Country</th>
                        <th>Plan</th>
                        <th>Price (Minor)</th>
                        <th>Currency</th>
                        <th>Credits / Mo</th>
                        <th>Status</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="pricing-tbody">
                    <tr><td colspan="7" style="text-align:center; padding: 20px;">Loading pricing plans...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div id="pricing-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="font-family: 'Space Grotesk', sans-serif; margin-top:0;">Edit Pricing Plan</h3>
            <form id="pricing-form" onsubmit="savePricing(event)">
                <div class="form-group">
                    <label>Country (ng, gb, gh)</label>
                    <input type="text" id="p-country" required maxlength="2">
                </div>
                <div class="form-group">
                    <label>Plan Name (base, plus, business)</label>
                    <input type="text" id="p-plan" required>
                </div>
                <div class="form-group">
                    <label>Monthly Price (Minor unit: kobo / pence / pesewas)</label>
                    <input type="number" id="p-price" required>
                </div>
                <div class="form-group">
                    <label>Currency (NGN, GBP, GHS)</label>
                    <input type="text" id="p-currency" required>
                </div>
                <div class="form-group">
                    <label>Credits Per Month</label>
                    <input type="number" id="p-credits" required>
                </div>
                <div class="form-group">
                    <label>Features (JSON Array format)</label>
                    <textarea id="p-features" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Active</label>
                    <select id="p-active">
                        <option value="1">Active</option>
                        <option value="0">Inactive</option>
                    </select>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Plan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allPlans = [];

        function loadPricing() {
            fetch('/api/admin/pricing')
                .then(res => res.json())
                .then(data => {
                    allPlans = data;
                    const tbody = document.getElementById('pricing-tbody');
                    tbody.innerHTML = data.map(p => `
                        <tr>
                            <td><strong>${p.country.toUpperCase()}</strong></td>
                            <td><span style="text-transform: capitalize;">${p.plan}</span></td>
                            <td>${p.monthly_price_minor.toLocaleString()}</td>
                            <td>${p.currency}</td>
                            <td>${p.credits_per_month}</td>
                            <td><span class="badge ${p.active ? 'badge-active' : 'badge-inactive'}">${p.active ? 'Active' : 'Inactive'}</span></td>
                            <td style="text-align: right;">
                                <button class="btn" style="padding: 4px 10px; font-size: 12px;" onclick="editPlan('${p.country}', '${p.plan}')">Edit</button>
                                <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;" onclick="deletePlan('${p.country}', '${p.plan}')">Deactivate</button>
                            </td>
                        </tr>
                    `).join('') || `<tr><td colspan="7" style="text-align:center;">No pricing plans found.</td></tr>`;
                })
                .catch(err => console.error('Error loading pricing:', err));
        }

        function openCreateModal() {
            document.getElementById('modal-title').innerText = 'Add New Pricing Plan';
            document.getElementById('p-country').value = 'ng';
            document.getElementById('p-country').disabled = false;
            document.getElementById('p-plan').value = 'custom';
            document.getElementById('p-plan').disabled = false;
            document.getElementById('p-price').value = '100000';
            document.getElementById('p-currency').value = 'NGN';
            document.getElementById('p-credits').value = '50';
            document.getElementById('p-features').value = JSON.stringify(["Feature 1", "Feature 2"], null, 2);
            document.getElementById('p-active').value = '1';
            document.getElementById('pricing-modal').classList.add('active');
        }

        function editPlan(country, plan) {
            const found = allPlans.find(p => p.country === country && p.plan === plan);
            if (!found) return;
            document.getElementById('modal-title').innerText = `Edit Plan: ${plan} (${country.toUpperCase()})`;
            document.getElementById('p-country').value = found.country;
            document.getElementById('p-country').disabled = true;
            document.getElementById('p-plan').value = found.plan;
            document.getElementById('p-plan').disabled = true;
            document.getElementById('p-price').value = found.monthly_price_minor;
            document.getElementById('p-currency').value = found.currency;
            document.getElementById('p-credits').value = found.credits_per_month;
            document.getElementById('p-features').value = JSON.stringify(found.features, null, 2);
            document.getElementById('p-active').value = found.active;
            document.getElementById('pricing-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('pricing-modal').classList.remove('active');
        }

        function savePricing(e) {
            e.preventDefault();
            const country = document.getElementById('p-country').value;
            const plan = document.getElementById('p-plan').value;
            const monthly_price_minor = parseInt(document.getElementById('p-price').value);
            const currency = document.getElementById('p-currency').value;
            const credits_per_month = parseInt(document.getElementById('p-credits').value);
            let features;
            try {
                features = JSON.parse(document.getElementById('p-features').value);
            } catch (err) {
                alert('Invalid JSON in features');
                return;
            }
            const active = parseInt(document.getElementById('p-active').value);

            const isEditing = document.getElementById('p-country').disabled;
            const url = isEditing ? `/api/admin/pricing/${country}/${plan}` : `/api/admin/pricing`;
            const method = isEditing ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ country, plan, monthly_price_minor, currency, credits_per_month, features, active })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    closeModal();
                    loadPricing();
                } else {
                    alert('Failed to save plan');
                }
            })
            .catch(err => {
                console.error(err);
                alert('Error saving plan');
            });
        }

        function deletePlan(country, plan) {
            if (!confirm(`Are you sure you want to deactivate ${plan} for ${country.toUpperCase()}?`)) return;
            fetch(`/api/admin/pricing/${country}/${plan}`, { method: 'DELETE' })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        loadPricing();
                    } else {
                        alert('Failed to deactivate plan');
                    }
                })
                .catch(err => console.error(err));
        }

        window.onload = loadPricing;
    </script>
</body>
</html>
