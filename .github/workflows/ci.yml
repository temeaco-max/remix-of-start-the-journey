name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm run audit:css:all

  fasttext:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install FastText CLI
        run: sudo apt-get update -qq && sudo apt-get install -y fasttext
      - run: npm install --no-audit --no-fund
      - run: npm run fasttext:build
      - name: Verify FastText model
        run: |
          npx tsx -e "import { classifyWithFastText } from './src/services/fastTextService.ts'; const samples=[['Book me a ride','ride_request'],['Find a plumber','find_worker'],['Order food near me','order_food']]; for (const [q,expected] of samples) { const r=classifyWithFastText(q); console.log(q,r); if (!r || r.intent!==expected) process.exit(1); }"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
