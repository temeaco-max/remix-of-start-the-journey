name: One-time chat router migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/one-time-mount-chat-router.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts src/database.ts
          git rm scripts/one-time-mount-chat-router.mjs .github/workflows/one-time-chat-router.yml
          git commit -m 'Mount canonical production chat router'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
