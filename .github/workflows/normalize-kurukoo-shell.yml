name: Normalize Kurukoo shell
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[shell-normalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Apply shell and public homepage refinements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path('.')
          restored = subprocess.check_output(['git','show','1b77ea62769738cb7d249fb0356ffb233d5e85a3:src/components/public-kurukoo-home.tsx'], text=True)
          (root/'src/components/public-kurukoo-home.tsx').write_text(restored)
          rr = root/'src/routes/__root.tsx'
          s = rr.read_text()
          s = s.replace('const anonymousHome = pathname === "/" && !authenticated;', 'const anonymousHome = pathname === "/";', 1)
          s = s.replace(': !authenticated && ((isPublic && !isAuthenticatedSurface) || anonymousHome) ?', ': anonymousHome ?', 1)
          s = s.replace('<PublicKurukooShell>{anonymousHome ? <PublicHome onSend={savePrompt} /> : <Outlet />}</PublicKurukooShell>', '<PublicKurukooShell><PublicHome onSend={savePrompt} /></PublicKurukooShell>', 1)
          rr.write_text(s)
          sh = root/'src/components/app-shell-contextual.tsx'
          s = sh.read_text()
          if 'import { logoutKurukoo } from "@/lib/kurukoo-auth";' not in s:
            s = s.replace('import { ReferralCard } from "@/components/kurukoo/referral-card";', 'import { ReferralCard } from "@/components/kurukoo/referral-card";\nimport { logoutKurukoo } from "@/lib/kurukoo-auth";', 1)
          s = re.sub(r'const logout = \(\) => \{ localStorage\.removeItem\("kurukoo-authenticated"\); window\.dispatchEvent\(new Event\("kurukoo-auth-updated"\)\); setOpen\(false\); \};', 'const logout = async () => { setOpen(false); await logoutKurukoo(); window.location.href = "/"; };', s, count=1)
          s = s.replace('<Link to="/" aria-label="Go to Kurukoo For You" title="Kurukoo For You"', '<Link to="/you" aria-label="Go to Kurukoo For You" title="Kurukoo For You"', 1)
          sh.write_text(s)
          topics = root/'src/routes/topics.tsx'
          s = topics.read_text()
          s = s.replace('rounded-[18px] bg-elevated/35 px-4 transition-colors hover:bg-elevated/55', 'rounded-[18px] border border-dotted border-border bg-elevated/35 px-4 transition-colors hover:bg-elevated/55')
          s = s.replace('rounded-[18px] bg-elevated/20 px-4 text-center', 'rounded-[18px] border border-dotted border-border bg-elevated/20 px-4 text-center')
          s = s.replace('<h2 className="mt-1.5 font-serif text-[28px] tracking-[-0.035em]">Browse Topics</h2>', '<h2 className="mt-1.5 font-serif text-[28px] tracking-[-0.035em]">Browse</h2>')
          s = s.replace('<h2 id="general-topics" className="font-serif text-[28px] tracking-[-0.035em]">General Topics</h2>', '<div><p className="text-[9px] font-bold uppercase tracking-[0.14em] text-primary">Kurukoo</p><h2 id="general-topics" className="font-serif text-[28px] leading-none tracking-[-0.035em]">General</h2></div>')
          topics.write_text(s)
          pc = root/'src/components/public-kurukoo-context.tsx'
          pc.write_text(pc.read_text().replace('return <aside aria-label="Kurukoo public context rail"', 'return <aside aria-label="Public context rail"'))
          for path in root.glob('src/**/*'):
            if path.is_file() and path.suffix in {'.tsx','.ts'}: path.write_text(path.read_text().replace('"/desk"','"/you"'))
          desk = root/'src/routes/desk.tsx'
          if desk.exists(): desk.unlink()
          (root/'src/routes/you.tsx').write_text('''import { createFileRoute } from "@tanstack/react-router";\nimport { HomePage } from "./index";\n\nexport const Route = createFileRoute("/you")({\n  head: () => ({ meta: [{ title: "For You — Kurukoo" }, { name: "description", content: "Your personal view for getting useful things done with Kurukoo." }] }),\n  component: HomePage,\n});\n''')
          PY
      - name: Validate build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit normalized shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Normalize public homepage and For You separation [shell-normalized]"
          git push
