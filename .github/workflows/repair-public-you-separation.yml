name: Repair public homepage and For You separation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore public homepage and fix shell routing
        shell: bash
        run: |
          set -euo pipefail
          # Restore the known-good public homepage composition that contained the
          # public-facing "See it in motion" section. Keep /you's OS surface separate.
          git show 1b77ea62769738cb7d249fb0356ffb233d5e85a3:src/components/public-kurukoo-home.tsx > src/components/public-kurukoo-home.tsx

          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/routes/__root.tsx')
          s = root.read_text()
          old = 'const anonymousHome = pathname === "/" && !authenticated; const needsAuthentication = !authenticated && isAuthenticatedSurface;'
          new = 'const anonymousHome = pathname === "/"; const needsAuthentication = !authenticated && isAuthenticatedSurface;'
          if old not in s:
              raise SystemExit('root anonymousHome marker not found')
          s = s.replace(old, new, 1)
          old = ': needsAuthentication ? <ProtectedPrompt /> : !authenticated && ((isPublic && !isAuthenticatedSurface) || anonymousHome) ? <PublicKurukooShell>{anonymousHome ? <PublicHome onSend={savePrompt} /> : <Outlet />}</PublicKurukooShell> : <><AppShell><Outlet /></AppShell><MobileBar />}</>'
          new = ': needsAuthentication ? <ProtectedPrompt /> : anonymousHome ? <PublicKurukooShell><PublicHome onSend={savePrompt} /></PublicKurukooShell> : !authenticated && ((isPublic && !isAuthenticatedSurface) || anonymousHome) ? <PublicKurukooShell><Outlet /></PublicKurukooShell> : <><AppShell><Outlet /></AppShell><MobileBar /></>}'
          if old not in s:
              raise SystemExit('root render marker not found')
          s = s.replace(old, new, 1)
          root.write_text(s)

          shell = Path('src/components/app-shell-contextual.tsx')
          s = shell.read_text()
          if 'import { logoutKurukoo } from "@/lib/kurukoo-auth";' not in s:
              marker = 'import { ReferralCard } from "@/components/kurukoo/referral-card";'
              if marker not in s:
                  raise SystemExit('shell import marker not found')
              s = s.replace(marker, marker + '\nimport { logoutKurukoo } from "@/lib/kurukoo-auth";', 1)
          old = 'const logout = () => { localStorage.removeItem("kurukoo-authenticated"); window.dispatchEvent(new Event("kurukoo-auth-updated")); setOpen(false); };'
          new = 'const logout = async () => { setOpen(false); await logoutKurukoo(); window.location.href = "/"; };'
          if old not in s:
              raise SystemExit('logout marker not found')
          s = s.replace(old, new, 1)
          old = '<Link to="/" aria-label="Go to Kurukoo For You" title="Kurukoo For You"'
          new = '<Link to="/you" aria-label="Go to Kurukoo For You" title="Kurukoo For You"'
          if old not in s:
              raise SystemExit('authenticated home icon marker not found')
          s = s.replace(old, new, 1)
          shell.write_text(s)
          PY

          git add src/routes/__root.tsx src/components/app-shell-contextual.tsx src/components/public-kurukoo-home.tsx
          git diff --cached --check
          git diff --cached --quiet || git commit -m "Separate public homepage from authenticated For You"
      - name: Validate build
        run: |
          corepack enable || true
          npm install -g bun
          bun install --frozen-lockfile
          bun run build
      - name: Push repair commit
        run: git push origin main
