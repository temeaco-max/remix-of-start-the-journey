name: One-time security codemod
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/one-time-security-codemod.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - name: Commit and remove codemod
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git rm scripts/one-time-security-codemod.mjs .github/workflows/one-time-security-codemod.yml
          git commit -m 'Remove remaining authentication fallbacks'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
