name: Refine Meet Kurukoo mega menu

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update mega menu and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/public-kurukoo.tsx')
          s = p.read_text()
          start = s.index('const meetKurukoo = [')
          end = s.index('\nconst forYou = [', start)
          replacement = '''const meetKurukoo = [
            { heading: "Core features", items: [["/kurukoo-ai", "Kurukoo AI"], ["/integrations", "Multi-Channel Access"], ["/kurukoo-ai", "Multi-AI Intelligence"], ["/chat", "Messaging & Calls"], ["/capabilities", "200+ capabilities"]] },
            { heading: "", items: [["/kurukoo-ai", "Coordinated AI Fulfillment"], ["/provider", "Personal AI Agents"], ["/memory", "Living Memory"], ["/provider", "Agentic AI Providers"]] },
            { heading: "Getting Started", items: [["/about", "About"], ["/chat", "Chat/Talk"], ["/discover", "Discover"], ["/opportunities", "Opportunities"]] },
          ] as const;'''
          p.write_text(s[:start] + replacement + s[end:])
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/public-kurukoo.tsx')
          s = p.read_text()
          s = s.replace('const routerDestinations = new Set(["/', 'const routerDestinations = new Set(["/')
          s = s.replace('"/ai-intelligence", ', '')
          s = s.replace('"/memory", ', '"/memory", ')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/public-kurukoo.tsx')
          s = p.read_text()
          old = '<p className="mb-2 px-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">{column.heading}</p>'
          new = '<p className={`mb-2 px-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted-foreground ${column.heading ? "" : "invisible"}`} aria-hidden={!column.heading}>{column.heading || "Core features"}</p>'
          if old not in s:
              raise SystemExit('expected menu heading renderer not found')
          p.write_text(s.replace(old, new, 1))
          PY

          rm .github/workflows/refine-meet-kurukoo-menu.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/public-kurukoo.tsx .github/workflows/refine-meet-kurukoo-menu.yml
          git diff --cached --check
          git commit -m "Refine Meet Kurukoo mega menu"
          git push origin HEAD:main
