name: One-time historical branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-historical-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete reconciled historical branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "activation-convergence-2026-08-19"
            "agent/end-to-end-convergence-2026-08-19"
            "capabilities"
            "chore/truth-verification-consolidation"
            "chore/truth-verification-consolidation-v2"
            "convergence-final-2026-08-19"
            "develop"
            "docs/kurukoo-os-agent-foundation"
            "feat/activation-and-provider-convergence"
            "feat/activation-mistral-channel-live"
            "feat/admin-platform-convergence"
            "feat/backend-admin-end-to-end-hardening"
            "feat/client-architecture-convergence"
            "feat/client-convergence-with-mobile"
            "feat/e2e-convergence-current-main"
            "feat/final-screen-refinement"
            "feat/production-scale-readiness-convergence"
            "feat/visual-refinement-final-pass"
            "feat/web-end-to-end-convergence"
            "feat/web-frontend-convergence"
            "feat/web-visual-convergence"
            "feature/kurukoo-os-weave-current"
            "feature/kurukoo-student-v1-training"
            "feature/platform-convergence-frames"
            "feature/progressive-identity"
            "feature/ride-communication-economy-finalization"
            "feature/ride-communication-economy-finalization-v2"
            "feature/ride-communication-economy-finalization-v3"
            "feature/ride-communication-economy-finalization-v4"
            "feature/ride-communication-economy-finalization-v5"
            "feature/ride-completion-on-convergence"
            "feature/ride-final"
            "feature/web-app-visual-convergence"
            "feature/web-mobile-visual-convergence"
            "fix/ai-provider-resolution-and-smollm2-truth"
            "fix/conversational-identity-slot-boundary"
            "fix/live-activation-security-and-provider"
            "fix/native-intelligence-learning-pipeline"
            "fix/security-test-jwt-fixtures-current-main"
            "hardening/pilot-production-boundary"
            "integration/kurukoo-os-final"
            "integration/kurukoo-os-final-trigger"
            "integration/near-completion"
            "integration/near-completion-final-candidate"
            "integration/near-completion-rebased"
            "integration/near-completion-rebased-final"
            "integration/visual-force-convergence"
            "security/gitleaks-test-fixtures-2026-08-19"
            "staging/revamped-admin-final"
          )

          for branch in "${branches[@]}"; do
            if gh api --silent "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            else
              echo "Already absent: ${branch}"
            fi
          done

      - name: Remove this one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          file_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/one-time-branch-cleanup.yml" --jq '.sha')
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/one-time-branch-cleanup.yml" \
            -f message='chore: remove one-time historical branch cleanup workflow' \
            -f sha="$file_sha" \
            -f branch='main' >/dev/null
