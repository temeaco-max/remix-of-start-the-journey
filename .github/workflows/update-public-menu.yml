name: Update public menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update menu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/public-kurukoo.tsx')
          s = p.read_text()
          s = re.sub(r'const meetKurukoo = \[.*?\] as const;', '''const meetKurukoo = [
  { heading: "Core features", items: [["/kurukoo-ai", "Kurukoo AI"], ["/integrations", "Multi-Channel Access"], ["/kurukoo-ai", "Multi-AI Intelligence"], ["/chat", "Messaging"]] },
  { heading: "", items: [["/providers", "Agentic Storefront"], ["/kurukoo-ai", "AI Agents"], ["/discover", "Nearby Radar & Pulse"]] },
  { heading: "Getting Started", items: [["/about", "About"], ["/chat", "Chat/Talk"], ["/discover", "Discover"], ["/opportunities", "Opportunities"]] },
] as const;''', s, count=1, flags=re.S)
          s = s.replace('["/ai-intelligence", "AI Intelligence"]', '["/kurukoo-ai", "Kurukoo AI"]')
          s = s.replace(', "/ai-intelligence"', '')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/public-kurukoo.tsx')
          s=p.read_text()
          s=s.replace('<p className="mb-2 px-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted-foreground">{column.heading}</p>', '<p className={`mb-2 px-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-muted-foreground ${column.heading ? "" : "invisible"}`}>{column.heading || "Core features"}</p>')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/public-kurukoo.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Refine Meet Kurukoo mega menu"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-public-menu.yml
          git add .github/workflows/update-public-menu.yml
          git commit -m "Remove temporary menu update workflow" || true
          git push || true
