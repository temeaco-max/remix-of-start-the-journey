name: Master convergence pass

on:
  push:
    branches: [feat/kurukoo-master-convergence]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kurukoo-master-convergence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize shell, terminology and route tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shell = Path('src/components/app-shell-contextual.tsx')
          text = shell.read_text()
          text = text.replace('import { ReferralCard } from "@/components/kurukoo/referral-card";', 'import { ReferralCard } from "@/components/kurukoo/referral-card";\nimport { PresenceRadarControl } from "@/components/kurukoo/presence-radar-control";')
          text = re.sub(r'function PresenceRadarControl\(\) \{.*?\nfunction HeaderSearch\(\)', 'function HeaderSearch()', text, count=1, flags=re.S)
          text = text.replace('{ to: "/perch", label: "Your Perch",', '{ to: "/perch", label: "Field",')
          text = text.replace('const more = [\n { to: "/network", label: "Network", icon: Users }, { to: "/capabilities", label: "Capabilities", icon: Sparkles }, { to: "/providers", label: "Providers", icon: Users }, { to: "/businesses", label: "Businesses", icon: Briefcase }, { to: "/creators", label: "Creators", icon: Sparkles }, { to: "/advertising", label: "Advertising", icon: Zap },\n] as const;', 'const more = [\n { to: "/network", label: "Network", icon: Users }, { to: "/capabilities", label: "Capabilities", icon: Sparkles }, { to: "/providers", label: "Providers", icon: Users }, { to: "/businesses", label: "Businesses", icon: Briefcase }, { to: "/creators", label: "Creators", icon: Sparkles }, { to: "/advertising", label: "Advertising", icon: Zap },\n] as const;')
          shell.write_text(text)

          replacements = {
            'Open Actions': 'Open Work',
            'Start with Croon': 'Start with Kurukoo',
            'Your Perch': 'Field',
          }
          for path in Path('src').rglob('*'):
            if path.suffix not in {'.ts', '.tsx', '.css', '.md'} or path == shell:
              continue
            try:
              value = path.read_text()
            except UnicodeDecodeError:
              continue
            updated = value
            for old, new in replacements.items():
              updated = updated.replace(old, new)
            if updated != value:
              path.write_text(updated)
          PY
          npx tsr generate
          npm install --no-audit --no-fund
          npm run build
      - name: Commit normalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || git commit -m "feat(frontend): reconcile canonical OS shell and routes"
          git push origin feat/kurukoo-master-convergence
